                <div class="flex items-center space-x-3">

                    </div>
                    <div>
                        <h1 class="text-base font-bold text-white leading-tight tracking-tight flex items-center">
                            Warehouse App

                                Live Sync Ready

                        </h1>
                        <p class="text-[11px] text-slate-400">Multi-device live sync connected</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2 sm:space-x-3">

                    <button onclick="window.print()" class="inline-flex items-center px-2.5 py-1.5 text-xs font-medium rounded-xl text-slate-200 bg-slate-800 hover:bg-slate-700 transition border border-slate-700">

                </div>

    <!-- PWA Auto Injector Script -->
    <script>
        // Inline Dynamic Manifest Injection
        const manifestObj = {
            "name": "Warehouse Invoice Manager",
            "short_name": "WarehouseApp",
            "start_url": "./",
            "display": "standalone",
            "background_color": "#080c14",
            "theme_color": "#080c14",
            "icons": [
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/3652/3652191.png",
                    "sizes": "192x192",
                    "type": "image/png"
                },
                {
                    "src": "https://cdn-icons-png.flaticon.com/512/3652/3652191.png",
                    "sizes": "512x512",
                    "type": "image/png"
                }
            ]
        };
        const manifestBlob = new Blob([JSON.stringify(manifestObj)], {type: 'application/json'});
        const manifestURL = URL.createObjectURL(manifestBlob);
        const manifestLink = document.createElement('link');
        manifestLink.rel = 'manifest';
        manifestLink.href = manifestURL;
        document.head.appendChild(manifestLink);

        // Register Inline Service Worker
        if ('serviceWorker' in navigator) {
            const swCode = `
                self.addEventListener('install', e => self.skipWaiting());
                self.addEventListener('activate', e => e.waitUntil(clients.claim()));
                self.addEventListener('fetch', e => e.respondWith(fetch(e.request).catch(() => new Response('Offline'))));
            `;
            const swBlob = new Blob([swCode], { type: 'text/javascript' });
            const swUrl = URL.createObjectURL(swBlob);
            navigator.serviceWorker.register(swUrl).catch(err => console.log('SW Note:', err));
        }

        // PWA Install Prompt Listener
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            const btn = document.getElementById('installPwaBtn');
            if (btn) btn.classList.remove('hidden');
        });

        function installPWA() {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        document.getElementById('installPwaBtn').classList.add('hidden');
                    }
                    deferredPrompt = null;
                });
            }
        }
    </script>

        const firebaseConfig = {
            apiKey: "AIzaSyClCasMqkv7_OqLZmWe-UC4eeA6ShP9pLk",
            authDomain: "warehouse-tracker-c0437.firebaseapp.com",
            databaseURL: "https://warehouse-tracker-c0437-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "warehouse-tracker-c0437",
            storageBucket: "warehouse-tracker-c0437.firebasestorage.app",
            messagingSenderId: "449706967433",
            appId: "1:449706967433:web:96c14f7e9b19fd2b792158",
            measurementId: "G-MHVJQ27PGH"
        };

        let db = null;
        let invoicesRef = null;
        let productsRef = null;
        let invoicesList = [];
        let dbCatalogSet = new Set();
        let fullCatalogSet = new Set(initialProductsList);
        let editingInvoiceId = null;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            invoicesRef = db.ref('invoices');
            productsRef = db.ref('products');

            productsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                dbCatalogSet.clear();
                if (data) {
                    Object.values(data).forEach(pName => {
                        if (pName) dbCatalogSet.add(pName.toString().trim());
                    });
                }
                rebuildProductCatalog();
            });

            invoicesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                invoicesList = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        invoicesList.push({ id: key, ...data[key] });
                    });
                }
                updateDashboardStats();
                renderHistoryTable();
                rebuildProductCatalog();
            });
        } catch (error) {
            console.error("Firebase Config Error:", error);
        }

        function rebuildProductCatalog() {
            fullCatalogSet = new Set([...initialProductsList, ...dbCatalogSet]);
            invoicesList.forEach(inv => {
                if (inv.items && Array.isArray(inv.items)) {
                    inv.items.forEach(i => { if (i.product) fullCatalogSet.add(i.product.toString().trim()); });
                } else if (inv.product) {
                    fullCatalogSet.add(inv.product.toString().trim());
                }
            });
            updateDatalistUI();
        }

        function updateDatalistUI() {
            const datalist = document.getElementById('productCatalogList');
            if (!datalist) return;
            const sortedList = Array.from(fullCatalogSet).filter(Boolean).sort();
            datalist.innerHTML = sortedList.map(item => `<option value="${item}">${item}</option>`).join('');
        }

        function addProductRow(productVal = '', qtyVal = '') {
            const container = document.getElementById('productRowsContainer');
            const rowDiv = document.createElement('div');
            rowDiv.className = "product-row grid grid-cols-12 gap-2 items-center bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80";
            rowDiv.innerHTML = `
                <div class="col-span-7 sm:col-span-8">
                    <input type="text" list="productCatalogList" class="product-name w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-brand-500 text-white" value="${productVal}" placeholder="Product name (type to search)" autocomplete="off" required>
                </div>
                <div class="col-span-3 sm:col-span-3">
                    <input type="number" min="1" class="product-qty w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-brand-500 text-white font-mono" value="${qtyVal}" placeholder="Qty" required>
                </div>
                <div class="col-span-2 sm:col-span-1 text-right">
                    <button type="button" onclick="removeProductRow(this)" class="w-8 h-8 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 flex items-center justify-center transition text-xs mx-auto">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `;
            container.appendChild(rowDiv);
        }

        function removeProductRow(button) {
            const container = document.getElementById('productRowsContainer');
            if (container.children.length > 1) {
                button.closest('.product-row').remove();
            } else {
                alert("At least one product item is required!");
            }
        }

        function saveInvoiceRecord(event) {
            event.preventDefault();
            if (!invoicesRef) return;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            const entryType = document.querySelector('input[name="entryType"]:checked').value;
            const invoiceNumber = document.getElementById('invoiceNumber').value.trim();
            const invoiceDate = document.getElementById('invoiceDate').value;

            const rowElements = document.querySelectorAll('.product-row');
            const items = [];

            rowElements.forEach(row => {
                const name = row.querySelector('.product-name').value.trim();
                const qty = parseInt(row.querySelector('.product-qty').value) || 0;
                if (name && qty > 0) {
                    items.push({ product: name, quantity: qty });
                    if (!fullCatalogSet.has(name) && productsRef) {
                        productsRef.push(name);
                        fullCatalogSet.add(name);
                    }
                }
            });

            if (items.length === 0) {
                alert("Please add at least one valid product!");
                submitBtn.disabled = false;
                return;
            }

            const recordData = {
                type: entryType,
                number: invoiceNumber || 'N/A',
                date: invoiceDate,
                items: items,
                timestamp: Date.now()
            };

            const savePromise = editingInvoiceId 
                ? invoicesRef.child(editingInvoiceId).set(recordData)
                : invoicesRef.push(recordData);

            savePromise.then(() => {
                alert("Saved & synced successfully!");
                cancelEditing();
            }).finally(() => {
                submitBtn.disabled = false;
            });
        }

        function editRecord(id) {
            const inv = invoicesList.find(item => item.id === id);
            if (!inv) return;

            editingInvoiceId = id;
            const radio = document.querySelector(`input[name="entryType"][value="${inv.type}"]`);
            if (radio) radio.checked = true;

            document.getElementById('invoiceNumber').value = (inv.number === 'N/A') ? '' : inv.number;
            document.getElementById('invoiceDate').value = inv.date || new Date().toISOString().slice(0, 10);

            const container = document.getElementById('productRowsContainer');
            container.innerHTML = '';
            const items = (inv.items && Array.isArray(inv.items)) ? inv.items : [{ product: inv.product || '', quantity: inv.quantity || 1 }];
            items.forEach(i => addProductRow(i.product, i.quantity));

            document.getElementById('formHeaderTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-amber-400 mr-2"></i>Edit Invoice Entry`;
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            switchTab('scan');
        }

        function cancelEditing() {
            editingInvoiceId = null;
            document.getElementById('invoiceForm').reset();
            document.getElementById('invoiceDate').valueAsDate = new Date();
            document.getElementById('formHeaderTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-brand-400 mr-2"></i>Invoice Entry Form`;
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('productRowsContainer').innerHTML = '';
            addProductRow();
        }

        function updateDashboardStats() {
            let inboundTotal = 0, outboundTotal = 0;
            invoicesList.forEach(inv => {
                if (inv.items && Array.isArray(inv.items)) {
                    inv.items.forEach(item => {
                        if (inv.type === 'inbound') inboundTotal += Number(item.quantity || 0);
                        if (inv.type === 'outbound') outboundTotal += Number(item.quantity || 0);
                    });
                }
            });
            document.getElementById('statInboundCount').innerText = inboundTotal;
            document.getElementById('statOutboundCount').innerText = outboundTotal;
            document.getElementById('statNetStockCount').innerText = inboundTotal - outboundTotal;
            document.getElementById('historyBadgeCount').innerText = invoicesList.length;
        }

        function renderHistoryTable() {
            const tbody = document.getElementById('historyTableBody');
            if (!tbody) return;
            if (invoicesList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">No records found</td></tr>`;
                return;
            }
            tbody.innerHTML = [...invoicesList].reverse().map(inv => {
                let itemsSummary = '', totalQty = 0;
                if (inv.items && Array.isArray(inv.items)) {
                    itemsSummary = inv.items.map(i => `<div class="py-0.5"><span class="text-white font-medium">${i.product}</span> <span class="text-slate-400 font-mono">(${i.quantity})</span></div>`).join('');
                    totalQty = inv.items.reduce((sum, i) => sum + Number(i.quantity || 0), 0);
                }
                return `
                    <tr class="border-b border-slate-800">
                        <td class="p-2.5 font-mono text-slate-400 align-top">${inv.date || '-'}</td>
                        <td class="p-2.5 align-top">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${inv.type === 'inbound' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                                ${inv.type === 'inbound' ? 'IN' : 'OUT'}
                            </span>
                        </td>
                        <td class="p-2.5 font-mono font-semibold text-white align-top">${inv.number || 'N/A'}</td>
                        <td class="p-2.5 text-slate-200 align-top">${itemsSummary}</td>
                        <td class="p-2.5 text-right font-mono font-bold align-top ${inv.type === 'inbound' ? 'text-emerald-400' : 'text-amber-400'}">${totalQty}</td>
                        <td class="p-2.5 text-center no-print align-top space-x-1">
                            <button onclick="editRecord('${inv.id}')" class="text-amber-400 hover:text-amber-300 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteRecord('${inv.id}')" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function deleteRecord(id) {
            if (confirm("Delete this invoice?")) db.ref('invoices/' + id).remove();
        }

        function switchTab(tabName) {
            const scanView = document.getElementById('tabScanView');
            const historyView = document.getElementById('tabHistoryView');
            if (tabName === 'scan') {
                scanView.classList.remove('hidden');
                historyView.classList.add('hidden');
            } else {
                scanView.classList.add('hidden');
                historyView.classList.remove('hidden');
            }
        }

        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Date,Type,Invoice Number,Product Name,Quantity\n";
            invoicesList.forEach(row => {
                if (row.items) row.items.forEach(item => csvContent += `${row.date},${row.type},${row.number},"${item.product}",${item.quantity}\n`);
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `warehouse_stock_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('invoiceDate').valueAsDate = new Date();
            rebuildProductCatalog();
        });
    </script>
