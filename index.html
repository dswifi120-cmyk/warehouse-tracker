                    <i class="fa-solid fa-boxes-stacked text-xl"></i>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white tracking-wide">Warehouse Tracker</h1>
                    <p class="text-xs text-slate-400">Inventory & Realtime Stock System</p>
                </div>
            </div>
            
            <!-- Navigation Tabs -->
            <div class="flex space-x-2 bg-slate-900 p-1.5 rounded-xl border border-slate-800">
                <button onclick="switchTab('scan')" id="tabBtnScan" class="px-4 py-2 rounded-lg text-xs font-semibold bg-brand-500 text-slate-950 transition">
                    <i class="fa-solid fa-plus-circle mr-1.5"></i> Entry Form
                </button>
                <button onclick="switchTab('history')" id="tabBtnHistory" class="px-4 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition">
                    <i class="fa-solid fa-list-check mr-1.5"></i> History & Logs
                    <span id="historyBadgeCount" class="ml-1.5 px-2 py-0.5 rounded-full bg-slate-800 text-[10px] text-brand-400">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-7xl mx-auto px-4 mt-6">

        <!-- Dashboard Stat Cards -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-8">
            <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium">Total Inbound Qty</p>
                    <h3 id="statInboundCount" class="text-2xl font-extrabold text-emerald-400 font-mono mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center border border-emerald-500/20">
                    <i class="fa-solid fa-arrow-down-left text-xl"></i>
                </div>
            </div>

            <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium">Total Outbound Qty</p>
                    <h3 id="statOutboundCount" class="text-2xl font-extrabold text-amber-400 font-mono mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center border border-amber-500/20">
                    <i class="fa-solid fa-arrow-up-right text-xl"></i>
                </div>
            </div>

            <div class="bg-slate-900/60 border border-slate-800 p-4 rounded-2xl flex items-center justify-between">
                <div>
                    <p class="text-xs text-slate-400 font-medium">Current Net Stock</p>
                    <h3 id="statNetStockCount" class="text-2xl font-extrabold text-brand-400 font-mono mt-1">0</h3>
                </div>
                <div class="w-12 h-12 rounded-xl bg-brand-500/10 text-brand-400 flex items-center justify-center border border-brand-500/20">
                    <i class="fa-solid fa-cubes text-xl"></i>
                </div>
            </div>
        </div>

        <!-- TAB 1: ENTRY FORM VIEW -->
        <section id="tabScanView" class="max-w-2xl mx-auto">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="flex items-center justify-between border-b border-slate-800 pb-4 mb-6">
                    <h2 id="formHeaderTitle" class="text-base font-semibold text-white">
                        <i class="fa-solid fa-pen-to-square text-brand-400 mr-2"></i>Invoice Entry Form
                    </h2>
                    <button type="button" id="cancelEditBtn" onclick="cancelEditing()" class="hidden text-xs text-red-400 hover:underline">
                        Cancel Edit
                    </button>
                </div>

                <form id="invoiceForm" onsubmit="saveInvoiceRecord(event)">
                    <!-- Transaction Type Selection -->
                    <div class="mb-5">
                        <label class="block text-xs font-semibold text-slate-400 mb-2">Entry Type</label>
                        <div class="grid grid-cols-2 gap-3">
                            <label class="flex items-center justify-center gap-2 p-3 rounded-xl border border-slate-800 bg-slate-950/40 cursor-pointer hover:border-emerald-500/50 has-[:checked]:border-emerald-500 has-[:checked]:bg-emerald-500/10 transition">
                                <input type="radio" name="entryType" value="inbound" checked class="accent-emerald-500">
                                <span class="text-xs font-bold text-emerald-400"><i class="fa-solid fa-arrow-down-left mr-1"></i> Inbound (Stock In)</span>
                            </label>
                            <label class="flex items-center justify-center gap-2 p-3 rounded-xl border border-slate-800 bg-slate-950/40 cursor-pointer hover:border-amber-500/50 has-[:checked]:border-amber-500 has-[:checked]:bg-amber-500/10 transition">
                                <input type="radio" name="entryType" value="outbound" class="accent-amber-500">
                                <span class="text-xs font-bold text-amber-400"><i class="fa-solid fa-arrow-up-right mr-1"></i> Outbound (Stock Out)</span>
                            </label>
                        </div>
                    </div>

                    <!-- Metadata (Invoice Number & Date) -->
                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-4 mb-5">
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Invoice / Ref Number</label>
                            <input type="text" id="invoiceNumber" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500" placeholder="e.g. INV-2024-001">
                        </div>
                        <div>
                            <label class="block text-xs font-semibold text-slate-400 mb-1">Date</label>
                            <input type="date" id="invoiceDate" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3.5 py-2.5 text-xs text-white focus:outline-none focus:border-brand-500">
                        </div>
                    </div>

                    <!-- Products List Builder -->
                    <div class="mb-6">
                        <div class="flex items-center justify-between mb-2">
                            <label class="block text-xs font-semibold text-slate-400">Products & Quantities</label>
                            <button type="button" onclick="addProductRow()" class="text-xs text-brand-400 hover:text-brand-300 font-semibold flex items-center gap-1">
                                <i class="fa-solid fa-plus"></i> Add Item
                            </button>
                        </div>
                        
                        <div id="productRowsContainer" class="space-y-2.5">
                            <!-- Dynamic rows will be inserted here -->
                        </div>
                    </div>

                    <!-- Datalist for Product Autocomplete -->
                    <datalist id="productCatalogList"></datalist>

                    <button type="submit" id="submitBtn" class="w-full bg-brand-500 hover:bg-brand-600 text-slate-950 font-bold py-3 rounded-xl transition text-xs flex items-center justify-center gap-2">
                        <i class="fa-solid fa-floppy-disk"></i> Save Transaction
                    </button>
                </form>
            </div>
        </section>

        <!-- TAB 2: HISTORY & LOGS VIEW -->
        <section id="tabHistoryView" class="hidden">
            <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl">
                <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4 mb-6">
                    <h2 class="text-base font-semibold text-white">
                        <i class="fa-solid fa-clock-rotate-left text-brand-400 mr-2"></i> Transaction History
                    </h2>
                    <button onclick="exportToCSV()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 font-medium px-4 py-2 rounded-xl transition text-xs flex items-center gap-2">
                        <i class="fa-solid fa-file-csv text-emerald-400"></i> Export to CSV
                    </button>
                </div>

                <div class="overflow-x-auto">
                    <table class="w-full text-left text-xs">
                        <thead>
                            <tr class="border-b border-slate-800 text-slate-400 uppercase text-[10px] tracking-wider">
                                <th class="p-3">Date</th>
                                <th class="p-3">Type</th>
                                <th class="p-3">Invoice #</th>
                                <th class="p-3">Products & Quantities</th>
                                <th class="p-3 text-right">Total Qty</th>
                                <th class="p-3 text-center no-print">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="historyTableBody" class="divide-y divide-slate-800/60">
                            <!-- Invoices will render dynamically -->
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

    </main>

        let invoicesList = [];
        let dbCatalogSet = new Set();
        let fullCatalogSet = new Set(initialProductsList);
        let editingInvoiceId = null;

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            invoicesRef = db.ref('invoices');
            productsRef = db.ref('products');

            productsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                dbCatalogSet.clear();
                if (data) {
                    Object.values(data).forEach(pName => {
                        if (pName) dbCatalogSet.add(pName.toString().trim());
                    });
                }
                rebuildProductCatalog();
            });

            invoicesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                invoicesList = [];
                if (data) {
                    Object.keys(data).forEach(key => {
                        invoicesList.push({ id: key, ...data[key] });
                    });
                }
                updateDashboardStats();
                renderHistoryTable();
                rebuildProductCatalog();
            });
        } catch (error) {
            console.error("Firebase Config Error:", error);
        }

        function rebuildProductCatalog() {
            fullCatalogSet = new Set([...initialProductsList, ...dbCatalogSet]);
            invoicesList.forEach(inv => {
                if (inv.items && Array.isArray(inv.items)) {
                    inv.items.forEach(i => { if (i.product) fullCatalogSet.add(i.product.toString().trim()); });
                } else if (inv.product) {
                    fullCatalogSet.add(inv.product.toString().trim());
                }
            });
            updateDatalistUI();
        }

        function updateDatalistUI() {
            const datalist = document.getElementById('productCatalogList');
            if (!datalist) return;
            const sortedList = Array.from(fullCatalogSet).filter(Boolean).sort();
            datalist.innerHTML = sortedList.map(item => `<option value="${item}">${item}</option>`).join('');
        }

        function addProductRow(productVal = '', qtyVal = '') {
            const container = document.getElementById('productRowsContainer');
            const rowDiv = document.createElement('div');
            rowDiv.className = "product-row grid grid-cols-12 gap-2 items-center bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80";
            rowDiv.innerHTML = `
                <div class="col-span-7 sm:col-span-8">
                    <input type="text" list="productCatalogList" class="product-name w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-brand-500 text-white" value="${productVal}" placeholder="Product name (type to search)" autocomplete="off" required>
                </div>
                <div class="col-span-3 sm:col-span-3">
                    <input type="number" min="1" class="product-qty w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-brand-500 text-white font-mono" value="${qtyVal}" placeholder="Qty" required>
                </div>
                <div class="col-span-2 sm:col-span-1 text-right">
                    <button type="button" onclick="removeProductRow(this)" class="w-8 h-8 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 flex items-center justify-center transition text-xs mx-auto">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `;
            container.appendChild(rowDiv);
        }

        function removeProductRow(button) {
            const container = document.getElementById('productRowsContainer');
            if (container.children.length > 1) {
                button.closest('.product-row').remove();
            } else {
                alert("At least one product item is required!");
            }
        }

        function saveInvoiceRecord(event) {
            event.preventDefault();
            if (!invoicesRef) return;

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;

            const entryType = document.querySelector('input[name="entryType"]:checked').value;
            const invoiceNumber = document.getElementById('invoiceNumber').value.trim();
            const invoiceDate = document.getElementById('invoiceDate').value;

            const rowElements = document.querySelectorAll('.product-row');
            const items = [];

            rowElements.forEach(row => {
                const name = row.querySelector('.product-name').value.trim();
                const qty = parseInt(row.querySelector('.product-qty').value) || 0;
                if (name && qty > 0) {
                    items.push({ product: name, quantity: qty });
                    if (!fullCatalogSet.has(name) && productsRef) {
                        productsRef.push(name);
                        fullCatalogSet.add(name);
                    }
                }
            });

            if (items.length === 0) {
                alert("Please add at least one valid product!");
                submitBtn.disabled = false;
                return;
            }

            const recordData = {
                type: entryType,
                number: invoiceNumber || 'N/A',
                date: invoiceDate,
                items: items,
                timestamp: Date.now()
            };

            const savePromise = editingInvoiceId 
                ? invoicesRef.child(editingInvoiceId).set(recordData)
                : invoicesRef.push(recordData);

            savePromise.then(() => {
                alert("Saved & synced successfully!");
                cancelEditing();
            }).finally(() => {
                submitBtn.disabled = false;
            });
        }

        function editRecord(id) {
            const inv = invoicesList.find(item => item.id === id);
            if (!inv) return;

            editingInvoiceId = id;
            const radio = document.querySelector(`input[name="entryType"][value="${inv.type}"]`);
            if (radio) radio.checked = true;

            document.getElementById('invoiceNumber').value = (inv.number === 'N/A') ? '' : inv.number;
            document.getElementById('invoiceDate').value = inv.date || new Date().toISOString().slice(0, 10);

            const container = document.getElementById('productRowsContainer');
            container.innerHTML = '';
            const items = (inv.items && Array.isArray(inv.items)) ? inv.items : [{ product: inv.product || '', quantity: inv.quantity || 1 }];
            items.forEach(i => addProductRow(i.product, i.quantity));

            document.getElementById('formHeaderTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-amber-400 mr-2"></i>Edit Invoice Entry`;
            document.getElementById('cancelEditBtn').classList.remove('hidden');
            switchTab('scan');
        }

        function cancelEditing() {
            editingInvoiceId = null;
            document.getElementById('invoiceForm').reset();
            document.getElementById('invoiceDate').valueAsDate = new Date();
            document.getElementById('formHeaderTitle').innerHTML = `<i class="fa-solid fa-pen-to-square text-brand-400 mr-2"></i>Invoice Entry Form`;
            document.getElementById('cancelEditBtn').classList.add('hidden');
            document.getElementById('productRowsContainer').innerHTML = '';
            addProductRow();
        }

        function updateDashboardStats() {
            let inboundTotal = 0, outboundTotal = 0;
            
            // Initial inventory base calculations
            initialProductsInventory.forEach(item => {
                inboundTotal += Number(item.quantity || 0);
            });

            // Firebase history additions/subtractions
            invoicesList.forEach(inv => {
                if (inv.items && Array.isArray(inv.items)) {
                    inv.items.forEach(item => {
                        if (inv.type === 'inbound') inboundTotal += Number(item.quantity || 0);
                        if (inv.type === 'outbound') outboundTotal += Number(item.quantity || 0);
                    });
                }
            });

            document.getElementById('statInboundCount').innerText = inboundTotal;
            document.getElementById('statOutboundCount').innerText = outboundTotal;
            document.getElementById('statNetStockCount').innerText = inboundTotal - outboundTotal;
            document.getElementById('historyBadgeCount').innerText = invoicesList.length;
        }

        function renderHistoryTable() {
            const tbody = document.getElementById('historyTableBody');
            if (!tbody) return;
            if (invoicesList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">No records found</td></tr>`;
                return;
            }
            tbody.innerHTML = [...invoicesList].reverse().map(inv => {
                let itemsSummary = '', totalQty = 0;
                if (inv.items && Array.isArray(inv.items)) {
                    itemsSummary = inv.items.map(i => `<div class="py-0.5"><span class="text-white font-medium">${i.product}</span> <span class="text-slate-400 font-mono">(${i.quantity})</span></div>`).join('');
                    totalQty = inv.items.reduce((sum, i) => sum + Number(i.quantity || 0), 0);
                }
                return `
                    <tr class="border-b border-slate-800">
                        <td class="p-2.5 font-mono text-slate-400 align-top">${inv.date || '-'}</td>
                        <td class="p-2.5 align-top">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${inv.type === 'inbound' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                                ${inv.type === 'inbound' ? 'IN' : 'OUT'}
                            </span>
                        </td>
                        <td class="p-2.5 font-mono font-semibold text-white align-top">${inv.number || 'N/A'}</td>
                        <td class="p-2.5 text-slate-200 align-top">${itemsSummary}</td>
                        <td class="p-2.5 text-right font-mono font-bold align-top ${inv.type === 'inbound' ? 'text-emerald-400' : 'text-amber-400'}">${totalQty}</td>
                        <td class="p-2.5 text-center no-print align-top space-x-1">
                            <button onclick="editRecord('${inv.id}')" class="text-amber-400 hover:text-amber-300 p-1"><i class="fa-solid fa-pen-to-square"></i></button>
                            <button onclick="deleteRecord('${inv.id}')" class="text-red-400 hover:text-red-300 p-1"><i class="fa-solid fa-trash"></i></button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function deleteRecord(id) {
            if (confirm("Delete this invoice?")) db.ref('invoices/' + id).remove();
        }

        function switchTab(tabName) {
            const scanView = document.getElementById('tabScanView');
            const historyView = document.getElementById('tabHistoryView');
            const btnScan = document.getElementById('tabBtnScan');
            const btnHistory = document.getElementById('tabBtnHistory');

            if (tabName === 'scan') {
                scanView.classList.remove('hidden');
                historyView.classList.add('hidden');
                btnScan.className = "px-4 py-2 rounded-lg text-xs font-semibold bg-brand-500 text-slate-950 transition";
                btnHistory.className = "px-4 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition";
            } else {
                scanView.classList.add('hidden');
                historyView.classList.remove('hidden');
                btnHistory.className = "px-4 py-2 rounded-lg text-xs font-semibold bg-brand-500 text-slate-950 transition";
                btnScan.className = "px-4 py-2 rounded-lg text-xs font-semibold text-slate-400 hover:text-white transition";
            }
        }

        function exportToCSV() {
            let csvContent = "data:text/csv;charset=utf-8,Date,Type,Invoice Number,Product Name,Quantity\n";
            invoicesList.forEach(row => {
                if (row.items) row.items.forEach(item => csvContent += `${row.date},${row.type},${row.number},"${item.product}",${item.quantity}\n`);
            });
            const link = document.createElement("a");
            link.setAttribute("href", encodeURI(csvContent));
            link.setAttribute("download", `warehouse_stock_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.addEventListener("DOMContentLoaded", () => {
            document.getElementById('invoiceDate').valueAsDate = new Date();
            addProductRow();
            rebuildProductCatalog();
            updateDashboardStats();
        });
    </script>
</body>
</html>
