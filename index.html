<!DOCTYPE html>
<html lang="bn" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Warehouse Invoice Manager - Multi-Device Live Sync</title>
    
    <!-- PWA Web App Capable Meta Tags -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Warehouse Tracker">
    <meta name="theme-color" content="#080c14">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Inter & Hind Siliguri -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <!-- Firebase SDK (Compat Version) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#080c14',
                        cardbg: '#0f172a',
                        cardborder: '#1e293b',
                        sheetbg: '#0b1329',
                        brand: {
                            50: '#ecfdf5',
                            100: '#d1fae5',
                            400: '#34d399',
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'Hind Siliguri', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <style>
        body {
            font-family: 'Inter', 'Hind Siliguri', sans-serif;
            background-color: #080c14;
            color: #f1f5f9;
            -webkit-tap-highlight-color: transparent;
        }
        
        .sheet-table th, .sheet-table td {
            border: 1px solid #1e293b;
        }
        .sheet-table tr:nth-child(even) {
            background-color: rgba(15, 23, 42, 0.6);
        }
        .sheet-table tr:nth-child(odd) {
            background-color: rgba(11, 19, 41, 0.8);
        }
        .sheet-table tr:hover {
            background-color: rgba(30, 41, 59, 0.9);
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #0f172a;
        }
        ::-webkit-scrollbar-thumb {
            background: #334155;
            border-radius: 4px;
        }

        .glass-header {
            background: rgba(15, 23, 42, 0.9);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        @media print {
            body { background-color: #ffffff !important; color: #000000 !important; }
            header, nav, button, .no-print { display: none !important; }
            main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            .bg-cardbg, .bg-sheetbg { background-color: #ffffff !important; color: #000000 !important; }
            .sheet-table th, .sheet-table td { border: 1px solid #64748b !important; color: #000000 !important; }
        }
    </style>
</head>
<body class="text-slate-100 antialiased min-h-screen flex flex-col pb-20 md:pb-6">

    <!-- Global Dynamic Datalist for Product Auto-Suggestion -->
    <datalist id="productCatalogList"></datalist>

    <!-- Header Section -->
    <header class="glass-header border-b border-slate-800 sticky top-0 z-30 shadow-lg no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between items-center h-16">
                <div class="flex items-center space-x-3">
                    <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-brand-600 to-emerald-400 flex items-center justify-center text-slate-950 font-black shadow-lg shadow-brand-500/20">
                        <i class="fa-solid fa-cloud-arrow-up text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-bold text-white leading-tight tracking-tight flex items-center">
                            Warehouse App
                            <span id="syncBadge" class="ml-2 text-[10px] bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 px-2 py-0.5 rounded-full font-mono flex items-center">
                                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 mr-1 animate-pulse"></span>
                                Live Sync Ready
                            </span>
                        </h1>
                        <p class="text-[11px] text-slate-400">Multi-device live sync connected</p>
                    </div>
                </div>

                <div class="flex items-center space-x-2 sm:space-x-3">
                    <button onclick="window.print()" class="inline-flex items-center px-2.5 py-1.5 text-xs font-medium rounded-xl text-slate-200 bg-slate-800 hover:bg-slate-700 transition border border-slate-700">
                        <i class="fa-solid fa-print text-brand-400 mr-1.5"></i>
                        <span class="hidden sm:inline">Print / PDF</span>
                    </button>
                    <button onclick="exportToCSV()" class="inline-flex items-center px-2.5 py-1.5 text-xs font-medium rounded-xl text-slate-300 bg-slate-800 hover:bg-slate-700 transition border border-slate-700">
                        <i class="fa-solid fa-file-excel text-emerald-400 mr-1.5"></i>
                        <span class="hidden sm:inline">CSV</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-1 max-w-7xl w-full mx-auto px-3 sm:px-6 lg:px-8 py-4 space-y-4">
        
        <!-- Quick Stats Dashboard -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 no-print">
            <div class="bg-cardbg border border-cardborder rounded-2xl p-3 flex items-center space-x-3 shadow-sm">
                <div class="w-9 h-9 rounded-xl bg-emerald-500/10 text-emerald-400 flex items-center justify-center text-sm">
                    <i class="fa-solid fa-arrow-down-left"></i>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Total Inbound (In)</p>
                    <p class="text-xs sm:text-sm font-bold text-emerald-400 font-mono" id="statInboundCount">0</p>
                </div>
            </div>

            <div class="bg-cardbg border border-cardborder rounded-2xl p-3 flex items-center space-x-3 shadow-sm">
                <div class="w-9 h-9 rounded-xl bg-amber-500/10 text-amber-400 flex items-center justify-center text-sm">
                    <i class="fa-solid fa-arrow-up-right"></i>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Total Outbound (Out)</p>
                    <p class="text-xs sm:text-sm font-bold text-amber-400 font-mono" id="statOutboundCount">0</p>
                </div>
            </div>

            <div class="bg-cardbg border border-cardborder rounded-2xl p-3 flex items-center space-x-3 shadow-sm">
                <div class="w-9 h-9 rounded-xl bg-blue-500/10 text-blue-400 flex items-center justify-center text-sm">
                    <i class="fa-solid fa-warehouse"></i>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Net Stock</p>
                    <p class="text-xs sm:text-sm font-bold text-blue-400 font-mono" id="statNetStockCount">0</p>
                </div>
            </div>

            <div class="bg-cardbg border border-cardborder rounded-2xl p-3 flex items-center space-x-3 shadow-sm">
                <div class="w-9 h-9 rounded-xl bg-purple-500/10 text-purple-400 flex items-center justify-center text-sm">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <p class="text-[10px] text-slate-400 uppercase tracking-wider font-semibold">Total Entries</p>
                    <p class="text-xs sm:text-sm font-bold text-purple-300 font-mono" id="historyBadgeCount">0</p>
                </div>
            </div>
        </div>

        <!-- Navigation Tabs -->
        <div class="flex border-b border-cardborder bg-cardbg p-1 rounded-2xl shadow-md no-print">
            <button id="tabScanBtn" onclick="switchTab('scan')" class="flex-1 py-2.5 px-4 rounded-xl font-medium text-xs transition flex items-center justify-center space-x-2 bg-brand-500/20 text-brand-400 border border-brand-500/40">
                <i class="fa-solid fa-pen-to-square"></i>
                <span>Invoice Entry</span>
            </button>
            <button id="tabHistoryBtn" onclick="switchTab('history')" class="flex-1 py-2.5 px-4 rounded-xl font-medium text-xs transition flex items-center justify-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800/50">
                <i class="fa-solid fa-list-check"></i>
                <span>Invoice History</span>
            </button>
        </div>

        <!-- Tab 1: Form Entry View -->
        <div id="tabScanView" class="grid grid-cols-1 gap-5">
            <form id="invoiceForm" onsubmit="saveInvoiceRecord(event)" class="bg-cardbg p-4 sm:p-5 rounded-2xl border border-cardborder shadow-xl space-y-4">
                <div class="flex items-center justify-between border-b border-slate-800 pb-3">
                    <h2 class="font-bold text-slate-100 text-sm flex items-center">
                        <i class="fa-solid fa-pen-to-square text-brand-400 mr-2"></i>
                        Invoice Entry Form
                    </h2>
                    <span class="text-[11px] text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-full border border-emerald-500/20 font-mono">Live Sync Active</span>
                </div>

                <!-- Entry Type Selector -->
                <div class="bg-slate-950 p-2.5 rounded-2xl border border-slate-800">
                    <label class="block text-[11px] font-bold text-slate-400 mb-1.5 uppercase tracking-wider px-1">
                        Select Entry Type <span class="text-red-400">*</span>
                    </label>
                    <div class="grid grid-cols-2 gap-2">
                        <label class="cursor-pointer">
                            <input type="radio" name="entryType" value="inbound" checked class="peer sr-only">
                            <div class="p-2.5 rounded-xl border border-slate-800 bg-slate-900 peer-checked:bg-emerald-500/20 peer-checked:border-emerald-500 peer-checked:text-emerald-300 text-slate-400 text-xs font-bold flex items-center justify-center space-x-2 transition">
                                <i class="fa-solid fa-arrow-down-left text-emerald-400"></i>
                                <span>📥 Inbound (Stock In)</span>
                            </div>
                        </label>

                        <label class="cursor-pointer">
                            <input type="radio" name="entryType" value="outbound" class="peer sr-only">
                            <div class="p-2.5 rounded-xl border border-slate-800 bg-slate-900 peer-checked:bg-amber-500/20 peer-checked:border-amber-500 peer-checked:text-amber-300 text-slate-400 text-xs font-bold flex items-center justify-center space-x-2 transition">
                                <i class="fa-solid fa-arrow-up-right text-amber-400"></i>
                                <span>📤 Outbound (Stock Out)</span>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Invoice Inputs (Invoice Number is OPTIONAL) -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Invoice / Challan No <span class="text-slate-500 text-[10px]">(Optional)</span></label>
                        <input type="text" id="invoiceNumber" class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-brand-500 text-white font-mono" placeholder="e.g. INV-2026-001 (Optional)">
                    </div>
                    <div>
                        <label class="block text-xs font-medium text-slate-400 mb-1">Date <span class="text-red-400">*</span></label>
                        <input type="date" id="invoiceDate" required class="w-full bg-slate-950 border border-slate-800 rounded-xl px-3 py-2.5 text-xs focus:outline-none focus:border-brand-500 text-white font-mono">
                    </div>
                </div>

                <!-- Dynamic Multiple Product Rows Container -->
                <div class="space-y-3">
                    <label class="block text-xs font-bold text-slate-300 uppercase tracking-wider">Product Items</label>
                    <div id="productRowsContainer" class="space-y-2.5">
                        <!-- Initial Row -->
                        <div class="product-row grid grid-cols-12 gap-2 items-center bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
                            <div class="col-span-7 sm:col-span-8">
                                <input type="text" list="productCatalogList" class="product-name w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-brand-500 text-white" placeholder="Product name (type to search)" autocomplete="off" required>
                            </div>
                            <div class="col-span-3 sm:col-span-3">
                                <input type="number" min="1" class="product-qty w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-brand-500 text-white font-mono" placeholder="Qty" required>
                            </div>
                            <div class="col-span-2 sm:col-span-1 text-right">
                                <button type="button" onclick="removeProductRow(this)" class="w-8 h-8 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 flex items-center justify-center transition text-xs mx-auto">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Add Product Button (Positioned Right Above Save & Sync) -->
                <div class="pt-1">
                    <button type="button" onclick="addProductRow()" class="w-full py-2.5 bg-slate-800/80 hover:bg-slate-800 text-brand-400 border border-brand-500/30 rounded-xl font-semibold text-xs transition flex items-center justify-center space-x-2">
                        <i class="fa-solid fa-plus text-xs"></i>
                        <span>Product jukto korun (+ Add Product)</span>
                    </button>
                </div>

                <!-- Submit Button -->
                <button type="submit" id="submitBtn" class="w-full py-3 bg-gradient-to-r from-brand-600 to-emerald-500 hover:from-brand-500 hover:to-emerald-400 text-slate-950 font-bold rounded-xl text-xs shadow-lg shadow-brand-500/20 transition flex items-center justify-center space-x-2">
                    <i class="fa-solid fa-floppy-disk text-sm"></i>
                    <span>Save & Sync Across Devices</span>
                </button>
            </form>
        </div>

        <!-- Tab 2: History List Table -->
        <div id="tabHistoryView" class="hidden bg-cardbg rounded-2xl border border-cardborder p-4 shadow-xl">
            <div class="flex items-center justify-between mb-4">
                <h3 class="font-bold text-slate-100 text-sm flex items-center">
                    <i class="fa-solid fa-list text-brand-400 mr-2"></i>
                    Live Invoice History
                </h3>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left sheet-table text-xs">
                    <thead>
                        <tr class="bg-slate-900 text-slate-300 font-mono">
                            <th class="p-2.5">Date</th>
                            <th class="p-2.5">Type</th>
                            <th class="p-2.5">Invoice #</th>
                            <th class="p-2.5">Products & Qty</th>
                            <th class="p-2.5 text-right">Total Qty</th>
                            <th class="p-2.5 text-center no-print">Action</th>
                        </tr>
                    </thead>
                    <tbody id="historyTableBody">
                        <tr>
                            <td colspan="6" class="text-center py-6 text-slate-500">Loading data...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <!-- Firebase Logic -->
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyClCasMqkv7_OqLZmWe-UC4eeA6ShP9pLk",
            authDomain: "warehouse-tracker-c0437.firebaseapp.com",
            databaseURL: "https://warehouse-tracker-c0437-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "warehouse-tracker-c0437",
            storageBucket: "warehouse-tracker-c0437.firebasestorage.app",
            messagingSenderId: "449706967433",
            appId: "1:449706967433:web:96c14f7e9b19fd2b792158",
            measurementId: "G-MHVJQ27PGH"
        };

        let db = null;
        let invoicesRef = null;
        let productsRef = null;
        let invoicesList = [];
        let dbCatalogSet = new Set();
        let fullCatalogSet = new Set();

        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
            invoicesRef = db.ref('invoices');
            productsRef = db.ref('products');

            // 1. Listen to Dynamic Product Catalog Node from Firebase
            productsRef.on('value', (snapshot) => {
                const data = snapshot.val();
                dbCatalogSet.clear();
                if (data) {
                    Object.values(data).forEach(pName => {
                        if (pName) dbCatalogSet.add(pName.toString().trim());
                    });
                }
                rebuildProductCatalog();
            });

            // 2. Listen to Invoices & Automatically Extract Product Names
            invoicesRef.on('value', (snapshot) => {
                const data = snapshot.val();
                invoicesList = [];
                
                if (data) {
                    Object.keys(data).forEach(key => {
                        invoicesList.push({
                            id: key,
                            ...data[key]
                        });
                    });
                }

                updateDashboardStats();
                renderHistoryTable();
                rebuildProductCatalog();
            });
        } catch (error) {
            console.error("Firebase Config Error:", error);
            alert("Firebase connection error: " + error.message);
        }

        // Rebuild catalog combining Database Catalog + All Invoices Products
        function rebuildProductCatalog() {
            fullCatalogSet = new Set(dbCatalogSet);

            // Add all items found in saved invoices
            invoicesList.forEach(inv => {
                if (inv.items && Array.isArray(inv.items)) {
                    inv.items.forEach(i => {
                        if (i.product) fullCatalogSet.add(i.product.toString().trim());
                    });
                } else if (inv.product) {
                    fullCatalogSet.add(inv.product.toString().trim());
                }
            });

            updateDatalistUI();
        }

        // Render Datalist Options for Mobile & Desktop Web
        function updateDatalistUI() {
            const datalist = document.getElementById('productCatalogList');
            if (!datalist) return;

            const sortedList = Array.from(fullCatalogSet).filter(Boolean).sort();
            
            datalist.innerHTML = sortedList
                .map(item => `<option value="${item}">${item}</option>`)
                .join('');
        }

        function addProductRow() {
            const container = document.getElementById('productRowsContainer');
            const rowDiv = document.createElement('div');
            rowDiv.className = "product-row grid grid-cols-12 gap-2 items-center bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80";
            rowDiv.innerHTML = `
                <div class="col-span-7 sm:col-span-8">
                    <input type="text" list="productCatalogList" class="product-name w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-brand-500 text-white" placeholder="Product name (type to search)" autocomplete="off" required>
                </div>
                <div class="col-span-3 sm:col-span-3">
                    <input type="number" min="1" class="product-qty w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-brand-500 text-white font-mono" placeholder="Qty" required>
                </div>
                <div class="col-span-2 sm:col-span-1 text-right">
                    <button type="button" onclick="removeProductRow(this)" class="w-8 h-8 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 flex items-center justify-center transition text-xs mx-auto">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            `;
            container.appendChild(rowDiv);
        }

        function removeProductRow(button) {
            const container = document.getElementById('productRowsContainer');
            if (container.children.length > 1) {
                button.closest('.product-row').remove();
            } else {
                alert("At least one product item is required!");
            }
        }

        function saveInvoiceRecord(event) {
            event.preventDefault();

            if (!invoicesRef) {
                alert("Firebase database connection failed!");
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.innerText = "Saving...";

            const entryType = document.querySelector('input[name="entryType"]:checked').value;
            const invoiceNumber = document.getElementById('invoiceNumber').value.trim();
            const invoiceDate = document.getElementById('invoiceDate').value;

            // Collect all product rows
            const rowElements = document.querySelectorAll('.product-row');
            const items = [];

            rowElements.forEach(row => {
                const name = row.querySelector('.product-name').value.trim();
                const qty = parseInt(row.querySelector('.product-qty').value) || 0;
                if (name && qty > 0) {
                    items.push({ product: name, quantity: qty });
                    
                    // Push newly entered products to Firebase catalog automatically
                    if (!fullCatalogSet.has(name) && productsRef) {
                        productsRef.push(name);
                        fullCatalogSet.add(name);
                    }
                }
            });

            if (items.length === 0) {
                alert("Please add at least one valid product with quantity!");
                submitBtn.disabled = false;
                submitBtn.innerHTML = `<i class="fa-solid fa-floppy-disk text-sm"></i><span>Save & Sync Across Devices</span>`;
                return;
            }

            const newRecord = {
                type: entryType,
                number: invoiceNumber || 'N/A',
                date: invoiceDate,
                items: items,
                timestamp: Date.now()
            };

            invoicesRef.push(newRecord)
                .then(() => {
                    alert("Saved & synced successfully!");
                    document.getElementById('invoiceForm').reset();
                    document.getElementById('invoiceDate').valueAsDate = new Date();
                    
                    // Reset product rows to single empty row
                    const container = document.getElementById('productRowsContainer');
                    container.innerHTML = `
                        <div class="product-row grid grid-cols-12 gap-2 items-center bg-slate-950/60 p-2.5 rounded-xl border border-slate-800/80">
                            <div class="col-span-7 sm:col-span-8">
                                <input type="text" list="productCatalogList" class="product-name w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-brand-500 text-white" placeholder="Product name (type to search)" autocomplete="off" required>
                            </div>
                            <div class="col-span-3 sm:col-span-3">
                                <input type="number" min="1" class="product-qty w-full bg-slate-900 border border-slate-800 rounded-lg px-3 py-2 text-xs focus:outline-none focus:border-brand-500 text-white font-mono" placeholder="Qty" required>
                            </div>
                            <div class="col-span-2 sm:col-span-1 text-right">
                                <button type="button" onclick="removeProductRow(this)" class="w-8 h-8 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 border border-red-500/20 flex items-center justify-center transition text-xs mx-auto">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                    `;
                })
                .catch((err) => {
                    alert("Error: " + err.message);
                })
                .finally(() => {
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = `<i class="fa-solid fa-floppy-disk text-sm"></i><span>Save & Sync Across Devices</span>`;
                });
        }

        function updateDashboardStats() {
            let inboundTotal = 0;
            let outboundTotal = 0;

            invoicesList.forEach(inv => {
                if (inv.items && Array.isArray(inv.items)) {
                    inv.items.forEach(item => {
                        if (inv.type === 'inbound') inboundTotal += Number(item.quantity || 0);
                        if (inv.type === 'outbound') outboundTotal += Number(item.quantity || 0);
                    });
                } else if (inv.quantity) {
                    // Backward compatibility for single product format
                    if (inv.type === 'inbound') inboundTotal += Number(inv.quantity);
                    if (inv.type === 'outbound') outboundTotal += Number(inv.quantity);
                }
            });

            document.getElementById('statInboundCount').innerText = inboundTotal;
            document.getElementById('statOutboundCount').innerText = outboundTotal;
            document.getElementById('statNetStockCount').innerText = inboundTotal - outboundTotal;
            document.getElementById('historyBadgeCount').innerText = invoicesList.length;
        }

        function renderHistoryTable() {
            const tbody = document.getElementById('historyTableBody');
            if (!tbody) return;

            if (invoicesList.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" class="text-center py-6 text-slate-500">No records found</td></tr>`;
                return;
            }

            const sorted = [...invoicesList].reverse();

            tbody.innerHTML = sorted.map(inv => {
                let itemsSummary = '';
                let totalQty = 0;

                if (inv.items && Array.isArray(inv.items)) {
                    itemsSummary = inv.items.map(i => `<div class="py-0.5"><span class="text-white font-medium">${i.product}</span> <span class="text-slate-400 font-mono">(${i.quantity})</span></div>`).join('');
                    totalQty = inv.items.reduce((sum, i) => sum + Number(i.quantity || 0), 0);
                } else {
                    // Fallback for single item format
                    itemsSummary = `<span class="text-white font-medium">${inv.product}</span> <span class="text-slate-400 font-mono">(${inv.quantity})</span>`;
                    totalQty = Number(inv.quantity || 0);
                }

                return `
                    <tr class="border-b border-slate-800">
                        <td class="p-2.5 font-mono text-slate-400 align-top">${inv.date || '-'}</td>
                        <td class="p-2.5 align-top">
                            <span class="px-2 py-0.5 rounded text-[10px] font-bold ${inv.type === 'inbound' ? 'bg-emerald-500/20 text-emerald-400 border border-emerald-500/30' : 'bg-amber-500/20 text-amber-400 border border-amber-500/30'}">
                                ${inv.type === 'inbound' ? 'IN' : 'OUT'}
                            </span>
                        </td>
                        <td class="p-2.5 font-mono font-semibold text-white align-top">${inv.number || 'N/A'}</td>
                        <td class="p-2.5 text-slate-200 align-top">${itemsSummary}</td>
                        <td class="p-2.5 text-right font-mono font-bold align-top ${inv.type === 'inbound' ? 'text-emerald-400' : 'text-amber-400'}">${totalQty}</td>
                        <td class="p-2.5 text-center no-print align-top">
                            <button onclick="deleteRecord('${inv.id}')" class="text-red-400 hover:text-red-300 p-1">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        function deleteRecord(id) {
            if (confirm("Are you sure you want to delete this invoice?")) {
                db.ref('invoices/' + id).remove();
            }
        }

        function switchTab(tabName) {
            const scanView = document.getElementById('tabScanView');
            const historyView = document.getElementById('tabHistoryView');
            const tabScanBtn = document.getElementById('tabScanBtn');
            const tabHistoryBtn = document.getElementById('tabHistoryBtn');

            if (tabName === 'scan') {
                scanView.classList.remove('hidden');
                historyView.classList.add('hidden');
                tabScanBtn.className = "flex-1 py-2.5 px-4 rounded-xl font-medium text-xs transition flex items-center justify-center space-x-2 bg-brand-500/20 text-brand-400 border border-brand-500/40";
                tabHistoryBtn.className = "flex-1 py-2.5 px-4 rounded-xl font-medium text-xs transition flex items-center justify-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800/50";
            } else {
                scanView.classList.add('hidden');
                historyView.classList.remove('hidden');
                tabHistoryBtn.className = "flex-1 py-2.5 px-4 rounded-xl font-medium text-xs transition flex items-center justify-center space-x-2 bg-brand-500/20 text-brand-400 border border-brand-500/40";
                tabScanBtn.className = "flex-1 py-2.5 px-4 rounded-xl font-medium text-xs transition flex items-center justify-center space-x-2 text-slate-400 hover:text-white hover:bg-slate-800/50";
            }
        }

        function exportToCSV() {
            if (invoicesList.length === 0) {
                alert("No data available to export!");
                return;
            }
            let csvContent = "data:text/csv;charset=utf-8,Date,Type,Invoice Number,Product Name,Quantity\n";
            
            invoicesList.forEach(row => {
                if (row.items && Array.isArray(row.items)) {
                    row.items.forEach(item => {
                        csvContent += `${row.date},${row.type},${row.number},"${item.product}",${item.quantity}\n`;
                    });
                } else {
                    csvContent += `${row.date},${row.type},${row.number},"${row.product}",${row.quantity}\n`;
                }
            });

            const encodedUri = encodeURI(csvContent);
            const link = document.createElement("a");
            link.setAttribute("href", encodedUri);
            link.setAttribute("download", `warehouse_stock_${new Date().toISOString().slice(0,10)}.csv`);
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
        }

        document.addEventListener("DOMContentLoaded", () => {
            const dateInput = document.getElementById('invoiceDate');
            if (dateInput) dateInput.valueAsDate = new Date();
        });
    </script>
</body>
</html>
